name: Test applicazione
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q dashboard.py collector.py storage.py classifier.py
      - name: Unit tests (no external API calls)
        run: python -m unittest discover -p 'test_*.py' -v
