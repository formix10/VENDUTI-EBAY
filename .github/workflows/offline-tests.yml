name: Offline tests
on:
  push:
    branches: [main, fix/soldcomps-indipendente]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: python -m pip install requests
      - name: Run offline tests
        run: python -m unittest -v test_offline
      - name: Check Python syntax
        run: python -m compileall -q collector.py storage.py dashboard.py test_offline.py
